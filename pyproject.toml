[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytscript"
version = "0.1.0"
description = "Check a YouTube channel for its newest video and turn it into a plain-text script."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
# Local speech-to-text. Pulls in ctranslate2 + a model download on first use.
local = ["faster-whisper>=1.0.0"]
# Hosted speech-to-text via the OpenAI audio transcription endpoint.
openai = ["openai>=1.30.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ytscript = "ytscript.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
